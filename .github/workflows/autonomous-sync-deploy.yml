name: Autonomous Sync & GitHub Pages Deploy

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 6 hours autonomously
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-test-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Execute Autonomous WT Wiki & Datamine Sync
        run: |
          npm run sync-data
          npm run scrape-changes

      - name: Commit & Push Updated Data If Changed (Scheduled Runs)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore(data): autonomous 6h WT wiki & datamine sync [skip ci]"
            git push origin main
          else
            echo "No changes detected in verified datasets."
          fi

      - name: Execute Vitest Suite
        run: npm run test

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5

      - name: Build Static Export
        env:
          NEXT_PUBLIC_BASE_PATH: "/WT-BR-Analyst"
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
